
name: Build LTC Music Studio APK

on:
  push:
    paths:
      - 'LTC_Music_Studio_V*_light.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select latest LTC light ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'LTC_Music_Studio_V*_light.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No LTC_Music_Studio_V*_light.zip found at repository root."
            exit 1
          fi
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Unpack app
        shell: bash
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "${{ steps.zip.outputs.file }}" -d appsrc
          test -f appsrc/package.json
          test -f appsrc/capacitor.config.json
          test -d appsrc/www

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: appsrc
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: appsrc/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name APK from package version
        id: version
        working-directory: appsrc
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APK_NAME="LTC_Music_Studio_V${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "../${APK_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "Built $APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LTC-Music-Studio-V${{ steps.version.outputs.version }}-APK
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "LTC Music Studio V${{ steps.version.outputs.version }}" \
              --notes "APK Android debug construit automatiquement depuis le package light LTC Music Studio V${{ steps.version.outputs.version }}."
          fi
